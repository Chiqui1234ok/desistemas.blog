<div class="controles-paginacion" style="text-align: center;">
    <button id="btn-prev-{{ list_id }}" onclick="cambiarPagina('{{ list_id }}', -1)" disabled class="button red">&laquo; Anterior</button>
    <span id="info-{{ list_id }}" style="margin: 0 10px;">Página 1 de {{ total_pages }}</span>
    <button id="btn-next-{{ list_id }}" onclick="cambiarPagina('{{ list_id }}', 1)" class="button red">Siguiente &raquo;</button>
</div>
