title: De Sistemas
language: "es_AR"
og_image: "/assets/img/og_image.webp"
email: ""
description: >- # this means to ignore newlines until "baseurl:"
  Blog sobre desarrollo y arquitectura de software, homelabing, redes y sistemas.
baseurl: ""
url: ""
paginate: 9
collections:
  pages:
    output: true
    permalink: /:path/
  news:
    output: true
    permalink: /noticias/:name/
  store:
    output: true   # Cada producto tendrá su propia URL
    permalink: /tienda/:name/
  announcements:
    output: true   # Cada producto tendrá su propia URL
    permalink: /adelantos/:name/

defaults:
  # Layout por defecto para las Noticias
  - scope:
      path: ""
      type: "news"
    values:
      layout: "news"

  # Layout por defecto para los Posts tradicionales
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

  # Layout por defecto para las Páginas estáticas
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

markdown: kramdown
highlighter: rouge

# Build settings
plugins:
  - jekyll-feed