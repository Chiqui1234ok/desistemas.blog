title: De Sistemas
language: "es_AR"
og_image: "/assets/img/og_image.webp"
email: ""
description: >- # this means to ignore newlines until "baseurl:"
  Blog sobre desarrollo y arquitectura de software, homelabing, redes y sistemas.
baseurl: ""
url: "https://desistemas.blog"
paginate: 9
collections:
  pages:
    output: true
    permalink: /:path/
  news:
    output: true
    permalink: /noticias/:name/
  store:
    output: true
    permalink: /tienda/:name/
  announcements:
    output: true
    permalink: /adelantos/:name/

defaults:
  # Layout por defecto para las Noticias
  - scope:
      path: ""
      type: "news"
    values:
      layout: "news"

  # Layout por defecto para los Posts tradicionales
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

  # Layout por defecto para las Páginas estáticas
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

  - scope:
      path: "404.html"
    values:
      sitemap: false

feed:
  posts_limit: 20
  collections:
    news:
      path: "/noticias/feed.xml"
    store:
      path: "/tienda/feed.xml"
    announcements:
      path: "/adelantos/feed.xml"

markdown: kramdown
highlighter: rouge

# Build settings
plugins:
  - jekyll-feed
  - jekyll-sitemap